<svg width="1290" height="2796" viewBox="0 0 1290 2796" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="energy6" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9CFF2E"/>
      <stop offset="0.5" stop-color="#34F5C5"/>
      <stop offset="1" stop-color="#19C3FF"/>
    </linearGradient>
    <radialGradient id="topGlow6" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#34F5C5" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#19C3FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#06080B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shieldGlow6" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#34F5C5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06080B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="device6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11181F"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>
    <filter id="softGlow6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip6"><rect x="345" y="980" width="600" height="1300" rx="62"/></clipPath>
  </defs>

  <rect width="1290" height="2796" fill="#06080B"/>
  <rect width="1290" height="1100" fill="url(#topGlow6)"/>

  <!-- Headline -->
  <text x="645" y="360" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial" font-size="100" font-weight="800" fill="#F4F7FA" letter-spacing="-2">Private. On-device.</text>
  <text x="645" y="486" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial" font-size="100" font-weight="800" fill="url(#energy6)" letter-spacing="-2">Always free.</text>
  <text x="645" y="594" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="40" font-weight="500" fill="#A6B0BB">Your health data never leaves your phone.</text>

  <!-- Device frame -->
  <rect x="318" y="952" width="654" height="1356" rx="92" fill="#000000"/>
  <rect x="326" y="960" width="638" height="1340" rx="86" fill="url(#device6)" stroke="#283039" stroke-width="2"/>
  <rect x="345" y="980" width="600" height="1300" rx="62" fill="#06080B"/>

  <g clip-path="url(#screenClip6)">
    <rect x="345" y="980" width="600" height="780" fill="url(#topGlow6)"/>
    <text x="385" y="1045" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="30" font-weight="600" fill="#F4F7FA">9:41</text>
    <g fill="#F4F7FA">
      <rect x="838" y="1024" width="34" height="22" rx="5" fill="none" stroke="#F4F7FA" stroke-width="2.5"/>
      <rect x="841" y="1028" width="26" height="14" rx="2"/>
      <rect x="874" y="1031" width="4" height="9" rx="2"/>
    </g>

    <!-- Shield glyph -->
    <rect x="445" y="1120" width="400" height="400" fill="url(#shieldGlow6)"/>
    <g transform="translate(645,1300)" filter="url(#softGlow6)">
      <path d="M0 -150 L130 -100 L130 10 C130 110 70 165 0 195 C-70 165 -130 110 -130 10 L-130 -100 Z"
            fill="none" stroke="url(#energy6)" stroke-width="12" stroke-linejoin="round"/>
      <!-- lock body inside -->
      <rect x="-50" y="0" width="100" height="78" rx="16" fill="url(#energy6)"/>
      <path d="M-32 0 L-32 -30 A32 32 0 0 1 32 -30 L32 0" fill="none" stroke="url(#energy6)" stroke-width="14"/>
      <circle cx="0" cy="34" r="11" fill="#06080B"/>
      <rect x="-5" y="34" width="10" height="26" rx="5" fill="#06080B"/>
    </g>

    <!-- Statement rows -->
    <g font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial">
      <!-- Row 1 -->
      <g transform="translate(385,1610)">
        <circle cx="34" cy="0" r="34" fill="#0E141A" stroke="#283039" stroke-width="2"/>
        <path d="M16 0 a18 12 0 0 1 36 0 a18 12 0 0 1 -36 0 M34 -8 a8 8 0 0 1 0 16 a8 8 0 0 1 0 -16" fill="none" stroke="#34F5C5" stroke-width="4"/>
        <text x="92" y="-6" font-size="34" font-weight="700" fill="#F4F7FA">Reads Apple Health, live</text>
        <text x="92" y="32" font-size="27" font-weight="500" fill="#A6B0BB">Sleep and activity, computed on device.</text>
      </g>
      <!-- Row 2 -->
      <g transform="translate(385,1730)">
        <circle cx="34" cy="0" r="34" fill="#0E141A" stroke="#283039" stroke-width="2"/>
        <rect x="18" y="-16" width="32" height="32" rx="6" fill="none" stroke="#34F5C5" stroke-width="4"/>
        <line x1="18" y1="0" x2="50" y2="0" stroke="#34F5C5" stroke-width="4"/>
        <line x1="34" y1="-16" x2="34" y2="16" stroke="#34F5C5" stroke-width="4"/>
        <text x="92" y="-6" font-size="34" font-weight="700" fill="#F4F7FA">Stores nothing</text>
        <text x="92" y="32" font-size="27" font-weight="500" fill="#A6B0BB">No servers, no cloud, no tracking.</text>
      </g>
      <!-- Row 3 -->
      <g transform="translate(385,1850)">
        <circle cx="34" cy="0" r="34" fill="#0E141A" stroke="#283039" stroke-width="2"/>
        <circle cx="34" cy="-8" r="11" fill="none" stroke="#34F5C5" stroke-width="4"/>
        <path d="M16 16 a18 14 0 0 1 36 0" fill="none" stroke="#34F5C5" stroke-width="4"/>
        <text x="92" y="-6" font-size="34" font-weight="700" fill="#F4F7FA">No account needed</text>
        <text x="92" y="32" font-size="27" font-weight="500" fill="#A6B0BB">Open the app and you are in.</text>
      </g>
      <!-- Row 4 -->
      <g transform="translate(385,1970)">
        <circle cx="34" cy="0" r="34" fill="#0E141A" stroke="#283039" stroke-width="2"/>
        <path d="M22 6 L34 -16 L46 6 Z" fill="none" stroke="#34F5C5" stroke-width="4" stroke-linejoin="round"/>
        <line x1="20" y1="14" x2="48" y2="14" stroke="#34F5C5" stroke-width="4"/>
        <text x="92" y="-6" font-size="34" font-weight="700" fill="#F4F7FA">No ads, always free</text>
        <text x="92" y="32" font-size="27" font-weight="500" fill="#A6B0BB">No subscriptions, no upsells.</text>
      </g>
    </g>

    <!-- Footer badge -->
    <rect x="385" y="2074" width="520" height="116" rx="58" fill="#0E141A" stroke="#34F5C5" stroke-width="2"/>
    <g transform="translate(452,2132)">
      <path d="M0 -30 L26 -20 L26 4 C26 24 14 34 0 40 C-14 34 -26 24 -26 4 L-26 -20 Z"
            fill="none" stroke="url(#energy6)" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-12 2 L-3 12 L14 -10" fill="none" stroke="url(#energy6)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="512" y="2148" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial" font-size="40" font-weight="700" fill="#F4F7FA">Built for your privacy</text>
  </g>

  <g fill="#283039">
    <circle cx="585" cy="2420" r="8"/>
    <circle cx="621" cy="2420" r="8"/>
    <circle cx="657" cy="2420" r="8"/>
    <circle cx="693" cy="2420" r="8"/>
    <circle cx="729" cy="2420" r="8"/>
    <circle cx="765" cy="2420" r="8" fill="#34F5C5"/>
  </g>
</svg>
