name: Amperly
options:
  bundleIdPrefix: com.amperly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # Set your Apple Developer Team ID in Xcode before archiving.
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EnergyKit:
    path: EnergyKit

targets:

  Amperly:
    type: application
    platform: iOS
    sources:
      - path: Amperly
    dependencies:
      - package: EnergyKit
        product: EnergyKit
      - target: AmperlyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"      # iPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Amperly/Info.plist
      properties:
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to compute your energy battery and efficiency score on your device. Your data is never stored or shared."
    entitlements:
      path: Amperly/Amperly.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  AmperlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AmperlyWidget
    dependencies:
      - package: EnergyKit
        product: EnergyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly.AmperlyWidget
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AmperlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to show your energy battery and efficiency score in the widget. Your data is never stored or shared."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AmperlyWidget/AmperlyWidget.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
