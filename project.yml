name: Amperly
options:
  bundleIdPrefix: com.amperly
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "VH5QK9LU35"  # Your paid Apple Developer team.
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  EnergyKit:
    path: EnergyKit

targets:

  Amperly:
    type: application
    platform: iOS
    sources:
      - path: Amperly
    dependencies:
      - package: EnergyKit
        product: EnergyKit
      - target: AmperlyWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"      # iPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: Amperly/Info.plist
      properties:
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.amperly.Amperly.refresh
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to compute your energy battery and efficiency score on your device. Your data is never stored or shared."
        NSHealthUpdateUsageDescription: "Amperly reads your data from Apple Health on your device to calculate your energy battery and efficiency score. Amperly never writes to or modifies your Apple Health data."
    entitlements:
      path: Amperly/Amperly.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  AmperlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AmperlyWidget
    dependencies:
      - package: EnergyKit
        product: EnergyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly.AmperlyWidget
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AmperlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to show your energy battery and efficiency score in the widget. Your data is never stored or shared."
        NSHealthUpdateUsageDescription: "Amperly reads your data from Apple Health on your device to calculate your energy battery and efficiency score. Amperly never writes to or modifies your Apple Health data."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AmperlyWidget/AmperlyWidget.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  # ---------------------------------------------------------------------------
  # Apple Watch app + complication.
  # Deliberately NOT embedded in the iPhone app, so the iPhone scheme builds
  # without them. To ship the watch app WITH the iPhone app, add this to the
  # Amperly target's dependencies and regenerate:
  #   - target: AmperlyWatch
  #     embed: true
  # ---------------------------------------------------------------------------
  AmperlyWatch:
    type: application
    platform: watchOS
    sources:
      - path: AmperlyWatch
      - path: AmperlyWatchShared
    dependencies:
      - package: EnergyKit
        product: EnergyKit
      - target: AmperlyWatchWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
    info:
      path: AmperlyWatch/Info.plist
      properties:
        WKApplication: true
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to show your energy battery and efficiency on your watch. Your data is never stored or shared."
    entitlements:
      path: AmperlyWatch/AmperlyWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  AmperlyWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: AmperlyWatchWidget
      - path: AmperlyWatchShared
    dependencies:
      - package: EnergyKit
        product: EnergyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amperly.Amperly.watchkitapp.AmperlyWatchWidget
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
    info:
      path: AmperlyWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Amperly
        CFBundleShortVersionString: "1.0"
        NSHealthShareUsageDescription: "Amperly reads your sleep, activity, heart, and hydration data from Apple Health to show your energy battery and efficiency on your watch. Your data is never stored or shared."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AmperlyWatchWidget/AmperlyWatchWidget.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
