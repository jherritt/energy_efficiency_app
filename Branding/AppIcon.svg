<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amperly app icon">
  <defs>
    <!-- Diagonal ink background: top-left ink to bottom-right deep teal-black -->
    <linearGradient id="bgInk" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#06222B"/>
    </linearGradient>

    <!-- Faint mint radial glow centered slightly above middle -->
    <radialGradient id="mintGlow" cx="512" cy="430" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34F5C5" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#34F5C5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#34F5C5" stop-opacity="0"/>
    </radialGradient>

    <!-- Vertical energy gradient: lime (bottom) -> mint -> cyan (top) -->
    <linearGradient id="energyVert" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9CFF2E"/>
      <stop offset="0.5" stop-color="#34F5C5"/>
      <stop offset="1" stop-color="#19C3FF"/>
    </linearGradient>

    <!-- Bolt edge stroke gradient -->
    <linearGradient id="boltEdge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#34F5C5"/>
      <stop offset="1" stop-color="#19C3FF"/>
    </linearGradient>

    <!-- Soft mint outer glow for the fill -->
    <filter id="fillGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="b"/>
      <feFlood flood-color="#34F5C5" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle background glow blur -->
    <filter id="bgGlowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- Bolt glow for the inner stroke -->
    <filter id="boltGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#19C3FF" flood-opacity="0.85" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!--
      Bolt path: classic 6-point lightning bolt, tilted ~10deg, centered near (512, 512).
      Authored upright then rotated. Geometry roughly within x[472..552], y[300..724].
    -->
    <path id="boltPath" d="
      M 548 300
      L 470 540
      L 520 540
      L 476 724
      L 566 470
      L 510 470
      Z"/>

    <!-- Mask: white shell-inner area minus the bolt (bolt = black = punched out) -->
    <mask id="fillMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="0" y="0" width="1024" height="1024" fill="black"/>
      <!-- inner fill region revealed -->
      <rect x="378" y="478" width="268" height="284" rx="40" fill="white"/>
      <!-- bolt punched out -->
      <use href="#boltPath" fill="black" transform="rotate(10 512 512)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bgInk)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#mintGlow)" filter="url(#bgGlowBlur)"/>

  <!-- Battery group: vertical battery ~40% width, ~70% height, centered -->
  <g>
    <!-- Terminal cap on top -->
    <rect x="452" y="218" width="120" height="44" rx="20" fill="#2A333D"/>

    <!-- Shell stroke (track) -->
    <rect x="366" y="272" width="292" height="504" rx="64"
          fill="none" stroke="#283039" stroke-width="24"/>

    <!-- Inner dark area (slightly inset) keeps unfilled portion reading as empty track tone -->
    <rect x="378" y="284" width="268" height="480" rx="52" fill="#0A1016"/>

    <!-- Energy fill bottom-up to ~70%, with bolt punched out via mask -->
    <g filter="url(#fillGlow)">
      <rect x="378" y="478" width="268" height="284" rx="40"
            fill="url(#energyVert)" mask="url(#fillMask)"/>
    </g>

    <!-- Glowing inner stroke tracing the bolt edge -->
    <use href="#boltPath"
         transform="rotate(10 512 512)"
         fill="none"
         stroke="url(#boltEdge)"
         stroke-width="6"
         stroke-linejoin="round"
         filter="url(#boltGlow)"/>
  </g>
</svg>
